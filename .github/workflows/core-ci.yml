name: Core CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build
        run: dotnet build tests/BridgeBuilder.Core.Tests/BridgeBuilder.Core.Tests.csproj --configuration Release

      - name: Test
        run: dotnet test tests/BridgeBuilder.Core.Tests/BridgeBuilder.Core.Tests.csproj --configuration Release --no-build
