name: Core CI

on:
  push:
  pull_request:

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build
        run: dotnet build tests/BridgeBuilder.Core.Tests/BridgeBuilder.Core.Tests.csproj
      - name: Test
        run: dotnet test tests/BridgeBuilder.Core.Tests/BridgeBuilder.Core.Tests.csproj --no-build
